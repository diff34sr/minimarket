<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Minimarket</title>
<link rel="manifest" href="caja.webmanifest">
<link rel="icon" href="img/icon-caja-256.png">
<link rel="apple-touch-icon" href="img/icon-caja-256.png">
<meta name="theme-color" content="#1d5fd6">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="app.css">
<script src="api.js"></script>
<style>
  body { min-height: 100dvh; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; padding: 72px 16px 24px;
    background: radial-gradient(900px 500px at 50% -10%, color-mix(in srgb, var(--accent) 16%, var(--bg)), var(--bg)); }
  .theme { position: fixed; top: calc(16px + env(safe-area-inset-top)); right: calc(16px + env(safe-area-inset-right)); }
  main { width: min(920px, 100%); text-align: center; }
  .brand { font-size: clamp(40px, 10vw, 96px); }
  .sub { color: var(--muted); font-size: 18px; margin: 4px 0 36px; }
  .apps { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 16px; }
  .app { display: grid; gap: 6px; justify-items: start; text-align: left; padding: 24px; border-radius: 24px; background: var(--surface); box-shadow: var(--shadow); color: inherit; text-decoration: none; border: 2px solid transparent;
    transition: transform .25s var(--spring), border-color .2s, box-shadow .25s; animation: rise .5s var(--ease) both; animation-delay: calc(var(--i) * 80ms); }
  .app:active { transform: scale(.98); }
  .app .ic { font-size: 42px; margin-bottom: 8px; transition: transform .3s var(--spring); }
  @media (hover: hover) {
    .app:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: var(--shadow-lg); }
    .app:hover .ic { transform: scale(1.12) rotate(-6deg); }
  }
  .app b { font-size: 22px; }
  .app span { color: var(--muted); }
  .connect { margin-top: 28px; padding: 18px 22px; border-radius: 20px; border: 2px dashed var(--line); display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px 16px; animation: rise .5s .3s var(--ease) both; }
  .connect code { font: 800 clamp(16px, 4.5vw, 20px) ui-monospace, monospace; padding: 8px 14px; border-radius: 12px; background: var(--surface); color: var(--accent); user-select: all; max-width: 100%; overflow-wrap: anywhere; }
</style>
</head>
<body>
<button class="iconbtn theme" data-theme-toggle aria-label="Cambiar tema"><span class="sun">☀︎</span><span class="moon">☾</span></button>
<main>
  <span class="brand"><span class="chick" aria-hidden="true">🛒</span>Minimarket</span>
  <p class="sub">Sistema de ventas · funciona en la red local</p>
  <div class="apps">
    <a class="app" href="pos.html" style="--i:0"><span class="ic">🧾</span><b>Caja</b><span>Escanea, cobra y registra la venta</span></a>
    <a class="app" href="admin.html" style="--i:1"><span class="ic">📊</span><b>Gestión</b><span>Productos, stock, ventas y reportes</span></a>
  </div>
  <div class="connect" id="connect" hidden>
    <span>📱 Teléfono: conéctalo al WiFi del local y abre</span>
  </div>
</main>
<script>
api('/info').then(({ urls }) => {
  if (!urls.length) return;
  $('#connect').insertAdjacentHTML('beforeend', `<code>${esc(urls[0].replace('http://', ''))}/pos.html</code>`);
  $('#connect').hidden = false;
}).catch(() => {});
</script>
</body>
</html>
